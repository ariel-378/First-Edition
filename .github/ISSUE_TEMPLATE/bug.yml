name: Bug report
description: Something on a page or in the editor doesn't work
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://your-school.github.io/paper/news.html
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari on iPhone, Chrome on a school Chromebook, …
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: If you know how, open the browser console and paste anything red here.
      render: text

# Accessibility and performance gate. School sites get accessibility
# complaints; a documented score pre-empts the question. Fails if any audited
# page scores under 95 for accessibility or under 90 for performance (the
# performance score is where a layout shift would show up again).
name: Lighthouse

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'site/**'
      - '.lighthouserc.json'
      - '.github/workflows/lighthouse.yml'
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
